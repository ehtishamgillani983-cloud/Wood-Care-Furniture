<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 130" width="580" height="130">
  <defs>
    <linearGradient id="wgFullNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A243F" />
      <stop offset="100%" stop-color="#101728" />
    </linearGradient>
    <linearGradient id="wgFullGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC06A" />
      <stop offset="50%" stop-color="#F2DA96" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="wgFullGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Luxury Navy Base Container -->
  <rect width="580" height="130" rx="14" fill="url(#wgFullNavy)" stroke="url(#wgFullGold)" stroke-width="2" />
  
  <!-- Subtle Inner Inset Border -->
  <rect x="6" y="6" width="568" height="118" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <g filter="url(#wgFullGlow)">
    <!-- W with signature flourish swash -->
    <path d="M 32 38 C 28 34, 24 38, 27 42 C 30 46, 36 41, 37 36 L 40 84 L 48 84 L 62 38 L 67 38 L 81 84 L 89 84 L 94 36 L 87 36 L 78 74 L 65 34 L 59 34 L 46 74 L 38 36 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.6" />

    <!-- First Interlocking Ring (O) -->
    <ellipse cx="120" cy="59" rx="22" ry="24" fill="none" stroke="url(#wgFullGold)" stroke-width="3.2" />

    <!-- Second Interlocking Ring (O) -->
    <ellipse cx="152" cy="59" rx="22" ry="24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.95" />

    <!-- Intersecting Overlap Accent -->
    <path d="M 136 38.5 A 22 24 0 0 1 142 59 A 22 24 0 0 1 136 79.5" fill="none" stroke="url(#wgFullGold)" stroke-width="3.2" stroke-linecap="round" />

    <!-- D with Classical Serif Silhouette -->
    <path d="M 184 36 L 184 84 L 200 84 C 218 84, 230 73, 230 60 C 230 47, 218 36, 200 36 Z M 192 43 L 199 43 C 212 43, 221 50, 221 60 C 221 70, 212 77, 199 77 L 192 77 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5" />

    <!-- GEAR in Bold Distinctive Display Typeface -->
    <g font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="1.5">
      <text x="246" y="75" fill="url(#wgFullGold)">GEAR</text>
    </g>

    <!-- Subtitle: FURNITURE in refined spaced editorial tracking -->
    <g font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="4">
      <text x="390" y="74" fill="#FFFFFF">FURNITURE</text>
    </g>
  </g>

  <!-- Tagline / Location Accent Bar -->
  <line x1="246" y1="92" x2="540" y2="92" stroke="url(#wgFullGold)" stroke-width="1.2" stroke-opacity="0.8" />
  <text x="393" y="107" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#EAE6DF" letter-spacing="3.5" text-anchor="middle">MANUFACTURER &amp; WHOLESALER • RAWALPINDI</text>
</svg>
