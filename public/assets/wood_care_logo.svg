<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="wcBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D2C22" />
      <stop offset="70%" stop-color="#2D2018" />
      <stop offset="100%" stop-color="#1F1510" />
    </radialGradient>

    <!-- Center Spotlight Gradient -->
    <radialGradient id="chairSpot" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F2F0EB" />
      <stop offset="70%" stop-color="#DCD6C9" />
      <stop offset="100%" stop-color="#A8A193" />
    </radialGradient>

    <!-- Curved Text Path for "WOOD CARE FURNITURE" -->
    <path id="textArcPath" d="M 95 250 A 155 155 0 1 1 405 250" fill="none" />
  </defs>

  <!-- Dark Chocolate Background -->
  <rect width="500" height="500" fill="url(#wcBgGrad)" />

  <!-- Outer Ornate Mandala Petals (Sage Green / Celadon #768A7D) -->
  <g fill="none" stroke="#768A7D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- 16 Radial Symmetrical Mandala Petals & Flourishes -->
    <g transform="translate(250, 250)">
      <!-- 12 Petals around perimeter -->
      <!-- 0 deg -->
      <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
      <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      <!-- 30 deg -->
      <g transform="rotate(30)">
        <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
        <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      </g>
      <!-- 60 deg -->
      <g transform="rotate(60)">
        <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
        <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      </g>
      <!-- 90 deg -->
      <g transform="rotate(90)">
        <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
        <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      </g>
      <!-- 120 deg -->
      <g transform="rotate(120)">
        <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
        <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      </g>
      <!-- 150 deg -->
      <g transform="rotate(150)">
        <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
        <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      </g>
      <!-- 180 deg -->
      <g transform="rotate(180)">
        <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
        <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      </g>
      <!-- 210 deg -->
      <g transform="rotate(210)">
        <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
        <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      </g>
      <!-- 240 deg -->
      <g transform="rotate(240)">
        <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
        <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      </g>
      <!-- 270 deg -->
      <g transform="rotate(270)">
        <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
        <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      </g>
      <!-- 300 deg -->
      <g transform="rotate(300)">
        <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
        <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      </g>
      <!-- 330 deg -->
      <g transform="rotate(330)">
        <path d="M 0 -242 C -18 -225, -28 -195, 0 -170 C 28 -195, 18 -225, 0 -242 Z" />
        <circle cx="0" cy="-215" r="4.5" fill="#768A7D" />
      </g>
      
      <!-- Interconnecting Outer Ring Arc Links -->
      <circle cx="0" cy="0" r="182" stroke="#768A7D" stroke-width="2" />
      <circle cx="0" cy="0" r="172" stroke="#768A7D" stroke-width="3.5" />
    </g>
  </g>

  <!-- Dark Chocolate Inner Medallion Disk -->
  <circle cx="250" cy="250" r="162" fill="#3A2920" stroke="#768A7D" stroke-width="5" />

  <!-- Arched Typography: "WOOD CARE FURNITURE" -->
  <text font-family="'Georgia', serif" font-weight="bold" font-size="33" fill="#FFFFFF" letter-spacing="4.5">
    <textPath href="#textArcPath" startOffset="50%" text-anchor="middle">
      WOOD CARE FURNITURE
    </textPath>
  </text>

  <!-- Center Focal Frame: Dark Spruce Teal Rim -->
  <circle cx="250" cy="245" r="82" fill="#14352F" stroke="#102C26" stroke-width="3" />
  <!-- Spotlight Base for Chair -->
  <circle cx="250" cy="245" r="77" fill="url(#chairSpot)" />

  <!-- The Iconic Handcrafted Sculptural Rocking Chair (Vectorized from Logo) -->
  <g transform="translate(250, 245)">
    <!-- Overhead subtle soft downlight -->
    <path d="M -12 -58 L 12 -58 L 35 25 L -35 25 Z" fill="#FFFFFF" opacity="0.3" filter="blur(6px)" />
    
    <!-- Curved Walnut Arch Frame -->
    <path d="M -44 14 C -36 32, -10 40, 22 26 C 36 20, 44 2, 42 -14 C 40 -34, 25 -52, -2 -54 C -10 -55, -14 -49, -8 -45 C 10 -40, 26 -24, 24 -4 C 22 14, 10 24, -14 26 C -32 27, -42 18, -44 14 Z" fill="#543825" stroke="#332115" stroke-width="1.2" />

    <!-- Rocker Bottom Runner Skids -->
    <path d="M -46 4 C -38 34, -2 46, 26 38 C 34 35, 38 28, 36 24 C 34 20, 26 26, 12 30 C -8 34, -30 26, -42 6 Z" fill="#3D2617" />
    
    <!-- Chair Backrest Support Leg -->
    <path d="M 0 4 L 14 -12 L 20 -10 L 4 6 Z" fill="#3D2617" />
    <rect x="-4" y="-18" width="22" height="15" rx="3" fill="#332115" transform="rotate(-15)" />

    <!-- Vibrant Emerald / Sage Green Seat Cushion -->
    <ellipse cx="-4" cy="5" rx="20" ry="7" fill="#698A44" stroke="#4F6B2E" stroke-width="1.5" transform="rotate(-6)" />
    <ellipse cx="-4" cy="4" rx="16" ry="4" fill="#84A856" opacity="0.8" transform="rotate(-6)" />
  </g>

  <!-- Script Cursive "furniture" Underneath Center Circle -->
  <text x="250" y="360" font-family="'Brush Script MT', 'Dancing Script', 'Playfair Display', cursive, serif" font-style="italic" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    furniture
  </text>
</svg>
